  <text x="340" y="430" font-family="sans-serif" font-size="13" font-weight="700" fill="#172422">Dr. Daniel Herrera</text>
  <text x="340" y="446" font-family="sans-serif" font-size="11" fill="#5a6966">Psiconutrición TCA (75%)</text>
  <text x="620" y="438" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f5247">Pago: $712.50</text>
