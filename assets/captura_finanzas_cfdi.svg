  <text x="312" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">SM</text>
  <text x="340" y="302" font-family="sans-serif" font-size="13" font-weight="700" fill="#172422">Dra. Sofía Mendoza</text>
