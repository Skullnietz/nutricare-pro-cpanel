<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172422" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="photoHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfe3dd"/>
      <stop offset="50%" stop-color="#9cc4b8"/>
      <stop offset="100%" stop-color="#6b9e90"/>
    </linearGradient>
    <linearGradient id="photoCard1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcebe6"/>
      <stop offset="100%" stop-color="#a8cfc3"/>
    </linearGradient>
    <linearGradient id="photoCard2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="photoCard3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="photoCard4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Warm Alabaster Background -->
  <rect width="1200" height="680" fill="#faf9f6"/>

  <!-- Public Header (Separated from Internal System) -->
  <rect width="1200" height="68" fill="#faf9f6"/>
  <line x1="0" y1="68" x2="1200" y2="68" stroke="#e4e2dc" stroke-width="1"/>
  <rect x="60" y="16" width="36" height="36" rx="9" fill="#0f5247"/>
  <path d="M88 34h-4l-3 7-4-14-3 7h-4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="108" y="33" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#172422">Clínica NutriMind</text>
  <text x="108" y="48" font-family="sans-serif" font-size="11" fill="#5a6966">Nutrición · Psicología · Checkups</text>

  <!-- Public Nav Links -->
  <text x="560" y="39" font-family="sans-serif" font-size="13" font-weight="500" fill="#5a6966">Especialidades</text>
  <text x="680" y="39" font-family="sans-serif" font-size="13" font-weight="500" fill="#5a6966">Checkups</text>
  <text x="770" y="39" font-family="sans-serif" font-size="13" font-weight="500" fill="#5a6966">Especialistas</text>
  <text x="880" y="39" font-family="sans-serif" font-size="13" font-weight="500" fill="#5a6966">Aranceles</text>
  <rect x="965" y="19" width="102" height="32" rx="8" fill="#0f5247"/>
  <text x="1016" y="39" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff">Agendar cita</text>
  <rect x="1080" y="19" width="80" height="32" rx="8" fill="#ffffff" stroke="#d4d1c7"/>
  <text x="1120" y="39" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#5a6966">Acceso</text>

  <!-- Editorial Hero Left -->
  <rect x="60" y="105" width="290" height="26" rx="13" fill="#e6f2ef"/>
  <text x="76" y="122" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f5247">CLÍNICA INTERDISCIPLINARIA EN CDMX</text>

  <text x="60" y="172" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#172422">Salud metabólica y</text>
  <text x="60" y="212" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#172422">bienestar emocional en</text>
  <text x="60" y="252" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#172422">un mismo consultorio.</text>

  <text x="60" y="290" font-family="sans-serif" font-size="14" fill="#5a6966">Integramos nutrición clínica, psicoterapia cognitivo-conductual y checkups</text>
  <text x="60" y="310" font-family="sans-serif" font-size="14" fill="#5a6966">metabólicos con atención cercana y basada en evidencia.</text>

  <rect x="60" y="335" width="155" height="42" rx="9" fill="#0f5247"/>
  <text x="137" y="361" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Agendar una cita</text>

  <rect x="228" y="335" width="165" height="42" rx="9" fill="#ffffff" stroke="#d4d1c7"/>
  <text x="310" y="361" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#172422">Conocer áreas clínicas</text>

  <!-- Editorial Hero Photo Frame Right -->
  <rect x="650" y="96" width="490" height="295" rx="18" fill="#ffffff" filter="url(#shadow)" stroke="#e4e2dc"/>
  <rect x="658" y="104" width="474" height="279" rx="12" fill="url(#photoHero)"/>
  <!-- Minimalist Illustration of Doctor & Patient Consultation -->
  <circle cx="845" cy="200" r="36" fill="#ffffff" opacity="0.85"/>
  <rect x="795" y="245" width="100" height="75" rx="20" fill="#ffffff" opacity="0.85"/>
  <circle cx="965" cy="215" r="32" fill="#0f5247" opacity="0.75"/>
  <rect x="920" y="255" width="90" height="65" rx="18" fill="#0f5247" opacity="0.75"/>

  <!-- Floating Specialist Card -->
  <rect x="625" y="325" width="295" height="72" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#e4e2dc"/>
  <circle cx="660" cy="361" r="22" fill="#0f5247"/>
  <text x="660" y="366" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">SM</text>
  <rect x="692" y="338" width="95" height="16" rx="8" fill="#e6f2ef"/>
  <text x="739" y="349" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f5247">ATENCIÓN PRESENCIAL</text>
  <text x="692" y="368" font-family="sans-serif" font-size="12" font-weight="700" fill="#172422">Consultorios equipados</text>
  <text x="692" y="383" font-family="sans-serif" font-size="10" fill="#5a6966">InBody, biomarcadores y psicoterapia.</text>

  <!-- 4 Visual Specialty Cards with Photography -->
  <g transform="translate(60, 435)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="252" height="205" rx="14" fill="#ffffff" stroke="#e4e2dc" filter="url(#shadow)"/>
    <rect x="6" y="6" width="240" height="90" rx="10" fill="url(#photoCard1)"/>
    <rect x="18" y="108" width="65" height="18" rx="9" fill="#e6f2ef"/>
    <text x="50" y="120" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f5247">NUTRICIÓN</text>
    <text x="18" y="144" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#172422">Nutrición Clínica e ISAK</text>
    <text x="18" y="164" font-family="sans-serif" font-size="11" fill="#5a6966">Evaluación InBody y planes SMAE.</text>
    <text x="18" y="190" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f5247">Desde $750 MXN</text>

    <!-- Card 2 -->
    <rect x="276" y="0" width="252" height="205" rx="14" fill="#ffffff" stroke="#e4e2dc" filter="url(#shadow)"/>
    <rect x="282" y="6" width="240" height="90" rx="10" fill="url(#photoCard2)"/>
    <rect x="294" y="108" width="72" height="18" rx="9" fill="#f3e8ff"/>
    <text x="330" y="120" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#6b21a8">PSICOLOGÍA</text>
    <text x="294" y="144" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#172422">Psicoterapia Clínica TCC</text>
    <text x="294" y="164" font-family="sans-serif" font-size="11" fill="#5a6966">Ansiedad, estrés y regulación emocional.</text>
    <text x="294" y="190" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f5247">Desde $850 MXN</text>

    <!-- Card 3 -->
    <rect x="552" y="0" width="252" height="205" rx="14" fill="#ffffff" stroke="#e4e2dc" filter="url(#shadow)"/>
    <rect x="558" y="6" width="240" height="90" rx="10" fill="url(#photoCard3)"/>
    <rect x="570" y="108" width="95" height="18" rx="9" fill="#fef3c7"/>
    <text x="617" y="120" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#9a5b13">PSICONUTRICIÓN</text>
    <text x="570" y="144" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#172422">Conducta Alimentaria</text>
    <text x="570" y="164" font-family="sans-serif" font-size="11" fill="#5a6966">Abordaje conjunto hambre emocional.</text>
    <text x="570" y="190" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f5247">$1,450 MXN</text>

    <!-- Card 4 -->
    <rect x="828" y="0" width="252" height="205" rx="14" fill="#ffffff" stroke="#e4e2dc" filter="url(#shadow)"/>
    <rect x="834" y="6" width="240" height="90" rx="10" fill="url(#photoCard4)"/>
    <rect x="846" y="108" width="76" height="18" rx="9" fill="#e0f2fe"/>
    <text x="884" y="120" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#075985">DIAGNÓSTICO</text>
    <text x="846" y="144" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#172422">Checkups Preventivos 360°</text>
    <text x="846" y="164" font-family="sans-serif" font-size="11" fill="#5a6966">HOMA-IR, lípidos, tiroides e InBody.</text>
    <text x="846" y="190" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f5247">Desde $1,650 MXN</text>
  </g>
</svg>
